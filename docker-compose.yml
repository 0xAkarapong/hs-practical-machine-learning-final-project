# Monorepo orchestration: ML pipeline (one-shot train+predict), the FastAPI
# bridge, and the Next.js frontend. The `api` + `pipeline` services share one
# image (hs-ml:latest) built from ./ml; `web` is the Next standalone image.
#
# First-time use:
#   docker compose up pipeline    # train into the models volume
#   docker compose up api web     # serve API :8000 + frontend :3000
# Do NOT bare `docker compose up` before training — api imports models at startup.
# Re-run `pipeline` whenever ml/ source changes to refresh persisted models.
services:
  pipeline:
    build: ./ml
    image: hs-ml:latest
    # Train the full pipeline, then predict — one command yields models + predictions.
    command: sh -c "python main.py && python predict.py"
    volumes:
      - models:/app/models
      - dataset:/app/dataset
      - figures:/app/notebooks/figures

  api:
    build: ./ml
    image: hs-ml:latest
    command: uvicorn api:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    # Read-only mounts: load persisted models (xgboost + PCA) + the raw table for /meta.
    # The models volume must be populated by a prior `pipeline` run.
    volumes:
      - models:/app/models:ro
      - dataset:/app/dataset:ro
    healthcheck:
      # Encoder + models load at import; allow a long start window before failing.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "3000:3000"
    environment:
      # Runtime only (see web/lib/api-proxy.ts). Not baked at image build time.
      API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  dataset:
  figures: