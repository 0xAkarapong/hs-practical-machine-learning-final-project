name: CI

on:
  push:
    branches-ignore: [main]   # any branch except main (PRs cover main); includes develop + all feature forks
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: "ml/.python-version"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff check .

  format:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: "ml/.python-version"
          enable-cache: true
      - run: uv sync --frozen --group dev
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version-file: "ml/.python-version"
          enable-cache: true
      - run: uv sync --frozen --group dev --group notebooks
      - run: uv run pytest
      - name: Execute notebooks (smoke test)
        # Globs are expanded by the shell; notebooks run in lexical order (01 → 02 → 03).
        run: |
          mkdir -p /tmp/nbexec
          uv run jupyter nbconvert \
            --to notebook \
            --execute \
            --output-dir=/tmp/nbexec \
            --ExecutePreprocessor.timeout=300 \
            notebooks/*.ipynb

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # Lightweight container checks: full hs-ml image bakes ~1GB e5 and is too
  # heavy for every PR. Validate compose + the slim Next image only.
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose file
        run: docker compose config --quiet
      - name: Build web image
        run: docker build -t hs-web:ci ./web
      - name: Assert standalone server.js entrypoint
        run: |
          id=$(docker create hs-web:ci)
          docker cp "$id:/app/server.js" /tmp/web-server.js
          docker rm "$id"
          test -s /tmp/web-server.js