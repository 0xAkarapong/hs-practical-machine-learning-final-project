[project]
name = "hs-practical-machine-learning-final-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.0",
    "nbconvert>=7.17.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=8.0.0",
]

[tool.ruff]
line-length = 88
include = ["*.py", "*.pyi"]   # notebooks are exploration artifacts; lint/format .py only
target-version = "py313"   # ponytail: py313 not py314 — ruff has no py314 target yet; upgrade when released

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
